<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Área de Serviço 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600&display=swap">
<style>
/* Layout: cena 3D em tela cheia; painel de controle por cima, embaixo no celular e à esquerda em telas largas. */
:root {
  --bg: #e8ecec;          /* fundo da cena: cinza de rejunte */
  --surface: #fbfcfb;
  --ink: #1c2a2e;
  --muted: #56676c;
  --line: #ccd6d7;
  --accent: #1d6470;      /* petróleo */
  --accent-ink: #ffffff;
  --focus: #e0a030;
  --shadow: rgba(20, 40, 45, 0.16);
  --veil: rgba(251, 252, 251, 0.88);
  --ok: #26703f;   --ok-bg: #dff1e5;
  --warn: #8a5800; --warn-bg: #fbedcf;
  --bad: #ad2a20;  --bad-bg: #fbe2df;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131a1c; --surface: #1c2629; --ink: #e5eef0; --muted: #9aabb0; --line: #2e3c40;
    --accent: #62b6c3; --accent-ink: #0c1a1d; --focus: #f0b54a; --shadow: rgba(0, 0, 0, 0.45); --veil: rgba(28, 38, 41, 0.88);
    --ok: #74c992; --ok-bg: #173022; --warn: #e6ae4f; --warn-bg: #34280f; --bad: #f28b82; --bad-bg: #3b1b18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131a1c; --surface: #1c2629; --ink: #e5eef0; --muted: #9aabb0; --line: #2e3c40;
  --accent: #62b6c3; --accent-ink: #0c1a1d; --focus: #f0b54a; --shadow: rgba(0, 0, 0, 0.45); --veil: rgba(28, 38, 41, 0.88);
  --ok: #74c992; --ok-bg: #173022; --warn: #e6ae4f; --warn-bg: #34280f; --bad: #f28b82; --bad-bg: #3b1b18;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }

#app { position: relative; height: 100%; overflow: hidden; }
#cena, #rotulos { position: absolute; inset: 0; }
#rotulos { pointer-events: none; z-index: 1; }
#cena canvas { display: block; touch-action: none; }
.carregando { position: absolute; inset: 0; display: grid; place-items: center; padding-inline: 16px; color: var(--muted); text-align: center; }

.topo {
  position: absolute; top: 12px; left: 16px; z-index: 2;
  width: fit-content; max-width: calc(100% - 32px);
  display: flex; flex-direction: column; gap: 2px;
  padding: 6px 12px 7px; border-radius: 10px; background: var(--veil);
  pointer-events: none;
}
.topo h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.4rem; letter-spacing: -0.01em; text-wrap: balance; }
.topo p { margin: 0; color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }

.painel {
  position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 2;
  display: flex; flex-direction: column; gap: 12px;
  max-height: 50%; overflow-y: auto;
  padding: 12px 14px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 10px 30px var(--shadow);
}
@media (min-width: 860px) {
  .painel { right: auto; width: 360px; top: 92px; max-height: none; }
}
.linha { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.linha.entre { justify-content: space-between; }

.segmentado { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.segmentado button {
  border: 0; border-radius: 7px; padding: 7px 12px;
  background: transparent; color: var(--ink);
  font: inherit; font-weight: 700; cursor: pointer;
}
.segmentado button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.segmentado.pequeno button { padding: 6px 9px; font-size: 0.85rem; }
.rotulo-linha { font-size: 0.85rem; font-weight: 700; color: var(--muted); }

.botao {
  border: 1.5px solid var(--accent); border-radius: 10px; padding: 7px 12px;
  background: transparent; color: var(--accent);
  font: inherit; font-weight: 700; cursor: pointer;
}
.botao[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.botao:disabled { opacity: 0.45; cursor: not-allowed; }
.discreto { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 0.85rem; text-decoration: underline; cursor: pointer; padding: 4px; }
.discreto:disabled { opacity: 0.5; cursor: default; text-decoration: none; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.titulo-secao { margin: 0 0 6px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

.resultados { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.resultados li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; align-items: baseline; }
.resultados .nome { font-weight: 700; }
.resultados .valor { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.resultados .detalhe { grid-column: 1 / -1; color: var(--muted); font-size: 0.82rem; }
.chip { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.02em; }
.chip.ok { color: var(--ok); background: var(--ok-bg); }
.chip.justo { color: var(--warn); background: var(--warn-bg); }
.chip.limite { color: var(--bad); background: var(--bad-bg); }

.vistas { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.vistas button {
  flex: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  background: var(--bg); color: var(--ink); font: inherit; font-size: 0.85rem; cursor: pointer;
}
.vistas button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }

.nota { margin: 0; color: var(--muted); font-size: 0.78rem; }

.abas { display: inline-flex; gap: 14px; }
.abas button {
  border: 0; border-bottom: 3px solid transparent; padding: 6px 0 5px;
  background: transparent; color: var(--muted);
  font: inherit; font-weight: 700; cursor: pointer;
}
.abas button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.conteudo-aba { display: flex; flex-direction: column; gap: 12px; }
.cartoes { display: grid; gap: 10px; }
.cartao { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.cartao img { display: block; width: 76px; height: auto; border-radius: 6px; background: #ffffff; }
.cartao .texto { display: grid; gap: 6px; min-width: 0; }
.cartao h2 { margin: 0; font-size: 1rem; line-height: 1.25; }
.cartao .modelo { margin: 0; font-size: 0.8rem; color: var(--muted); }
.cartao dl { margin: 0; display: grid; gap: 1px; font-size: 0.86rem; }
.cartao dt { margin-top: 5px; color: var(--muted); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.cartao dd { margin: 0; font-variant-numeric: tabular-nums; }
.cartao a { font-size: 0.82rem; color: var(--accent); }
.ajustes { border-top: 1px solid var(--line); padding-top: 10px; }
.ajustes summary { cursor: pointer; font-weight: 700; color: var(--accent); }
.ajustes summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.campo { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; margin-top: 12px; }
.campo label { font-size: 0.88rem; }
.campo output { font-weight: 700; font-variant-numeric: tabular-nums; }
.campo input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 4px 0 0; accent-color: var(--accent); }
.campo input[type="range"]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.campo .ajuda { grid-column: 1 / -1; margin: 0; font-size: 0.78rem; color: var(--muted); }
.ajustes .discreto { margin-top: 8px; }
@media (max-width: 599px) {
  .painel { max-height: 42%; gap: 10px; padding: 10px 12px 12px; }
  .resultados .detalhe { display: none; }
  .resultados { gap: 6px; }
}

.mostrar-painel {
  position: absolute; left: 16px; bottom: 16px; z-index: 2;
  border: 0; border-radius: 10px; padding: 9px 14px;
  background: var(--accent); color: var(--accent-ink);
  font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 6px 18px var(--shadow);
}

.rotulo {
  padding: 3px 7px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px var(--shadow);
  font-family: var(--font-body); font-size: 11.5px; line-height: 1.2; white-space: nowrap;
}
.rotulo.medida { border-color: transparent; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.rotulo.ok { border-color: transparent; background: var(--ok-bg); color: var(--ok); font-weight: 700; }
.rotulo.justo { border-color: transparent; background: var(--warn-bg); color: var(--warn); font-weight: 700; }
.rotulo.limite { border-color: transparent; background: var(--bad-bg); color: var(--bad); font-weight: 700; }
.rotulo.sutil { opacity: 0.85; font-size: 10.5px; }
</style>
</head>
<body>
<div id="app">
  <div id="cena"><div class="carregando" id="carregando">Carregando a área de serviço em 3D…</div></div>
  <div id="rotulos"></div>

  <header class="topo">
    <h1>Área de serviço</h1>
    <p id="subtitulo">Simulação aproximada · 2,00 m × 1,20 m</p>
  </header>

  <section class="painel" id="painel" aria-label="Controles da simulação">
    <div class="linha entre">
      <div class="abas" role="tablist" aria-label="Seções">
        <button type="button" role="tab" id="aba-simulacao" aria-selected="true" aria-controls="conteudo-simulacao">Simulação</button>
        <button type="button" role="tab" id="aba-escolhidos" aria-selected="false" aria-controls="conteudo-escolhidos" tabindex="-1">Aparelhos escolhidos</button>
      </div>
      <button type="button" class="discreto" id="esconder">Esconder</button>
    </div>

    <div class="conteudo-aba" id="conteudo-simulacao" role="tabpanel" aria-labelledby="aba-simulacao">
      <div class="segmentado" role="group" aria-label="Cenário">
        <button type="button" id="cenario-hoje" aria-pressed="false">Hoje</button>
        <button type="button" id="cenario-reforma" aria-pressed="true">Com a reforma</button>
      </div>

      <div class="linha" id="linha-variante">
        <span class="rotulo-linha">Lava-louças</span>
        <div class="segmentado pequeno" role="group" aria-label="Tipo de lava-louças">
          <button type="button" id="variante-piso" aria-pressed="true">De piso · 10 serv.</button>
          <button type="button" id="variante-bancada" aria-pressed="false">De bancada · 8 serv.</button>
        </div>
      </div>

      <div>
        <p class="titulo-secao">Espaço que sobra</p>
        <ul class="resultados" id="resultados"></ul>
      </div>

      <details class="ajustes" id="ajustes">
        <summary>E se…? Ajustar medidas</summary>
        <div id="campos"></div>
        <button type="button" class="discreto" id="restaurar">Voltar às medidas originais</button>
      </details>
    </div>

    <div class="conteudo-aba" id="conteudo-escolhidos" role="tabpanel" aria-labelledby="aba-escolhidos" hidden>
      <div class="linha">
        <span class="rotulo-linha">Lava-louças</span>
        <div class="segmentado pequeno" role="group" aria-label="Onde fica a lava-louças">
          <button type="button" id="posicao-cima" aria-pressed="true">Em cima da pedra</button>
          <button type="button" id="posicao-baixo" aria-pressed="false">Ao lado da lava e seca</button>
        </div>
      </div>
      <p class="nota" id="nota-escolhidos"></p>
      <div class="cartoes" id="cartoes"></div>
    </div>

    <div class="linha">
      <button type="button" class="botao" id="portas" aria-pressed="false">Abrir as portas dos aparelhos</button>
    </div>

    <div>
      <p class="titulo-secao">Ver de</p>
      <div class="vistas" role="group" aria-label="Ponto de vista">
        <button type="button" data-vista="geral" aria-pressed="true">Visão geral</button>
        <button type="button" data-vista="cozinha" aria-pressed="false">Da cozinha</button>
        <button type="button" data-vista="frente" aria-pressed="false">De frente</button>
        <button type="button" data-vista="janela" aria-pressed="false">Da janela</button>
        <button type="button" data-vista="cima" aria-pressed="false">De cima</button>
      </div>
    </div>

    <div class="linha entre">
      <p class="nota">Arraste para girar · pinça ou rolagem para zoom</p>
      <button type="button" class="discreto" id="nomes" aria-pressed="true">Esconder nomes</button>
    </div>
    <p class="nota" id="nota-medidas"></p>
  </section>
  <button type="button" class="mostrar-painel" id="mostrar" hidden>Mostrar painel</button>
</div>

<script>
  // Se o 3D não carregar (sem internet ou navegador antigo), avisa em vez de ficar em branco.
  setTimeout(function () {
    if (!window.__cenaPronta) {
      var el = document.getElementById('carregando');
      if (el) el.textContent = 'Não foi possível carregar o 3D. Confira a internet e recarregue a página.';
    }
  }, 12000);
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ======================================================================
//  MEDIDAS (em cm)
//  Origem: canto da PAREDE CEGA com a PAREDE DOS ARMÁRIOS, no chão.
//  x: da parede cega até a janela · z: da parede dos armários até a
//  parede da porta · y: altura.  (E) = estimado pelas fotos.
//  As medidas de PADRAO podem ser mudadas na página, em "E se…?".
// ======================================================================
const PADRAO = { corredor: 120, fundo: 70, passagem: 80, portaLL: 118, portaLS: 110 };
const AJUSTES = [
  { id: 'corredor', nome: 'Corredor, de parede a parede', min: 100, max: 150, ajuda: 'Medida passada ao Gemini: 120 cm.' },
  { id: 'fundo', nome: 'Fundo da bancada de pedra', min: 55, max: 80, ajuda: 'O Gemini sugeriu de 67 a 70 cm.' },
  { id: 'passagem', nome: 'Largura da passagem da cozinha', min: 60, max: 110, ajuda: 'Estimada pelas fotos. Só muda o desenho.' },
  { id: 'portaLL', nome: 'Lava-louças de piso com a porta aberta', min: 90, max: 130, ajuda: 'Do fundo da máquina até a ponta da porta deitada. Vem no manual.' },
  { id: 'portaLS', nome: 'Lava e seca com a porta aberta', min: 90, max: 125, ajuda: 'Do fundo da máquina até a ponta da porta aberta a 90°.' },
];

// llEmbaixo: a lava-louças de bancada vai para baixo da pedra, ao lado da lava e seca.
// O nicho dela cresce para 57 cm (55 + 1 cm de cada lado) e o armário da cuba encolhe na mesma medida.
function montarMedidas(a, { llEmbaixo = false } = {}) {
  const P = a.passagem, W = a.corredor, L = P + 200;
  return {
    comodo: { comprimento: L, largura: W, peDireito: 250 },             // comprimento: passagem + 2,00 m de bancada
    passagemCozinha: { inicio: 0, largura: P, altura: 210 },            // (E) na parede dos armários
    portaPredio: { inicio: 6, largura: 72, altura: 210 },               // (E) na parede da porta, abre para dentro
    janela: { inicio: 12, largura: Math.min(75, W - 30), altura: 110, peitoril: 100 }, // (E) início medido da parede da porta
    armariosAereos: { inicio: P, fim: L, profundidade: 35, base: 178, portas: 8 }, // (E)
    quadroLuz: { inicio: 112, largura: 30, base: 112, altura: 40 },     // (E)
    interfone: { inicio: 90, largura: 12, base: 165, altura: 15 },      // (E)
    interruptor: { inicio: 92, largura: 8, base: 104, altura: 12 },     // (E)
    varal: { inicio: P + 70, fim: L - 18, altura: 198 },                // (E)
    azulejo: { largura: 33, altura: 45 },                               // (E) só visual
    piso: { lado: 60 },                                                 // (E) só visual
    reforma: {
      bancada: { inicio: P, comprimento: 200, profundidade: a.fundo, alturaLivre: 87.5, espessura: 3, rodabanca: 10 },
      // Da passagem da cozinha para a janela:
      nichoLavaSeca: 65, nichoLavaLoucas: llEmbaixo ? 57 : 50, armarioCuba: llEmbaixo ? 78 : 85,
      lavaSeca: { largura: 60, altura: 85, profundidade: 65, portaAberta: a.portaLS, centroPorta: 45, folgaFundo: 3 }, // centro da porta medido na foto de frente
      lavaLoucas: { largura: 44.8, altura: 84.5, profundidade: 60, portaAberta: a.portaLL, dobradica: 10, folgaFundo: 3 },
      // Plano B: lava-louças de bancada de 8 serviços, medidas da Midea Touch Plus MDWTF08S.
      // Pela foto de frente: rodapé de 10,3 cm, porta de 41,5 cm e painel de 7,7 cm (porta aberta = 50 + 41,5).
      lavaLoucasBancada: { largura: 55, altura: 59.5, profundidade: 50, portaAberta: 91.5, dobradica: 10.3, folgaFundo: 5 },
      cuba: { largura: 30, profundidade: 35 },
    },
    hoje: {
      forno: { inicio: P + 5, largura: 50, profundidade: 37, alturaSuporte: 75, alturaForno: 32 }, // (E)
      maquina: { inicio: P + 60, largura: 56, profundidade: 61, altura: 96, folgaFundo: 3 },     // (E) Consul 9 kg
      tanque: { inicio: L - 56, largura: 54, profundidade: 46, alturaBorda: 88 },                // (E)
      sapateira: { inicio: L - 32, fim: L, z0: W - 38, z1: W - 2, altura: 48 },                  // (E)
      lixeira: { inicio: L - 28, fim: L - 4, z0: 52, z1: 74, altura: 45 },                       // (E)
    },
    pessoa: { altura: 160, x: L - 50 },
  };
}

// Aparelhos escolhidos pelo usuário (aba "Aparelhos escolhidos").
const ESCOLHIDOS = {
  lavaSeca: {
    nome: 'Lava e seca Samsung WD11M',
    modelo: 'WD11M4473PX · Inox Look · lava 11 kg, seca 7 kg',
    foto: 'img/samsung.jpg',
    alt: 'Foto da lava e seca Samsung WD11M Inox Look',
    loja: 'https://www.samsung.com/br/washers-and-dryers/washer-dryer-combo/wd4000t-front-loading-air-wash-drum-clean-bubble-soak-11kg-gray-wd11m4473px-az',
  },
  lavaLoucas: {
    nome: 'Lava-louças Midea Touch Plus',
    modelo: 'MDWTF08S · Cinza · 8 serviços · de bancada',
    foto: 'img/midea.jpg',
    alt: 'Foto da lava-louças Midea Touch Plus cinza, com as medidas 55 × 59,5 × 50 cm',
    loja: 'https://site.fastshop.com.br/lava-loucas-midea-touch-plus-cinza-com-08-servicos-e-05-programas-de-lavagem---mdwtf08s-1qmdwtf08s_prd/p',
  },
};

// ---------- Contas de folga ----------
function calcularFolgas(M) {
  const W = M.comodo.largura, B = M.reforma.bancada;
  const ls = M.reforma.lavaSeca, ll = M.reforma.lavaLoucas, lb = M.reforma.lavaLoucasBancada, maq = M.hoje.maquina;
  const angulo = (espaco, porta) => espaco >= porta ? 90 : THREE.MathUtils.radToDeg(Math.asin(THREE.MathUtils.clamp(espaco / porta, 0, 1)));
  // Porta que abre para baixo (lava-louças): gira na base da frente.
  const portaBaixo = ap => {
    const frente = ap.folgaFundo + ap.profundidade, comp = ap.portaAberta - ap.profundidade, espaco = W - frente;
    return { frente, comp, sobra: espaco - comp, angulo: angulo(espaco, comp), ponta: ap.folgaFundo + ap.portaAberta };
  };
  // Lava e seca: a porta redonda fica 5 cm à frente do corpo; o diâmetro sai da medida com a porta aberta.
  const lsFrente = ls.folgaFundo + ls.profundidade - 5, lsPorta = ls.portaAberta - (ls.profundidade - 5), lsEspaco = W - lsFrente;
  const frenteLS = ls.folgaFundo + ls.profundidade;
  return {
    corredorPiso: W - Math.max(B.profundidade, frenteLS, ll.folgaFundo + ll.profundidade),
    corredorBancada: W - Math.max(B.profundidade, frenteLS),
    corredorHoje: W - (maq.folgaFundo + maq.profundidade),
    ls: { frente: lsFrente, comp: lsPorta, sobra: lsEspaco - lsPorta, angulo: angulo(lsEspaco, lsPorta), ponta: ls.folgaFundo + ls.portaAberta },
    ll: portaBaixo(ll),
    lb: portaBaixo(lb),
  };
}

function texturaAzulejo(largura, altura, cor, rejunte) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = Math.round(256 * altura / largura);
  const g = c.getContext('2d');
  g.fillStyle = cor; g.fillRect(0, 0, c.width, c.height);
  g.strokeStyle = rejunte; g.lineWidth = 4; g.strokeRect(0, 0, c.width, c.height);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  t.repeat.set(100 / largura, 100 / altura); // UV em metros
  return t;
}
function texturaGranito() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#545a5e'; g.fillRect(0, 0, 512, 512);
  const cores = ['#3a3f42', '#6a7175', '#7f8586', '#454b4e', '#90938f'];
  for (let i = 0; i < 9000; i++) {
    g.fillStyle = cores[i % cores.length];
    g.globalAlpha = 0.25 + Math.random() * 0.35;
    g.fillRect(Math.random() * 512, Math.random() * 512, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  t.repeat.set(2, 1);
  return t;
}

const cacheFoto = new Map();
function guardado(id, criar) {

function texturaCanvas(c) {

}
// Faixa horizontal da foto (topo e base em fração da altura) como textura espelhada.
function texturaFoto(chave, topo, base) {
  return guardado(`tex:${chave}:${topo}:${base}`, () => {
    const img = fotos[chave], sy = img.naturalHeight * topo, sh = img.naturalHeight * (base - topo);
    const c = document.createElement('canvas');
    c.width = img.naturalWidth; c.height = Math.max(1, Math.round(sh));
    const g = c.getContext('2d');
    g.translate(c.width, 0); g.scale(-1, 1);
    g.drawImage(img, 0, sy, img.naturalWidth, sh, 0, 0, c.width, c.height);
    return texturaCanvas(c);
  });
}
// Materiais de uma caixa com a foto só na frente (+z); sem a foto carregada, usa a cor lisa.
function comFoto(chave, topo, base, lado) {

}
// Porta fechada da Samsung: aro preto e vidro mostrando o tambor recortado da foto.
function materialPortaSamsung() {
  if (!fotos.samsung) return mat.escuro;
  return guardado('mat:porta-samsung', () => {
    const img = fotos.samsung, k = img.naturalWidth / 600, c = document.createElement('canvas');
    c.width = c.height = 512;
    const g = c.getContext('2d'), r = 256, rv = r * 0.64;
    const aro = g.createRadialGradient(r * 0.8, r * 0.7, 20, r, r, r);
    aro.addColorStop(0, '#34373b'); aro.addColorStop(1, '#141618');
    g.fillStyle = aro; g.beginPath(); g.arc(r, r, r, 0, Math.PI * 2); g.fill();
    g.save();
    g.beginPath(); g.arc(r, r, rv, 0, Math.PI * 2); g.clip();
    const cx = 300 * k, cy = 402 * k, rf = 175 * k;
    g.drawImage(img, cx - rf, cy - rf, rf * 2, rf * 2, r - rv, r - rv, rv * 2, rv * 2);
    const brilho = g.createRadialGradient(r * 0.75, r * 0.7, 10, r, r, rv);
    brilho.addColorStop(0, 'rgba(255,255,255,0.45)'); brilho.addColorStop(1, 'rgba(255,255,255,0.08)');
    g.fillStyle = brilho; g.fillRect(0, 0, 512, 512);

    g.beginPath(); g.arc(r, r, rv, 0, Math.PI * 2); g.stroke();
    return new THREE.MeshStandardMaterial({ map: texturaCanvas(c), roughness: 0.25, metalness: 0.1 });
  });
}

const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
// Caixa definida pelos limites em cm, no sistema do grupo onde for colocada.
function caixa(x0, x1, y0, y1, z0, z1, material, sombra = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(S(x1 - x0), S(y1 - y0), S(z1 - z0)), material);
  m.position.set(S((x0 + x1) / 2), S((y0 + y1) / 2), S((z0 + z1) / 2));
  m.castShadow = sombra; m.receiveShadow = true;
  return m;
}
// Superfície plana com vãos (porta, janela, passagem), feita de retângulos.
// UV em metros, para o azulejo ficar no tamanho certo em qualquer medida.
function superficie({ ponto, comprimento, altura, vaos = [], material }) {
  const us = new Set([0, comprimento]), vs = new Set([0, altura]);
  for (const o of vaos) { us.add(o.u0); us.add(o.u1); vs.add(o.v0); vs.add(o.v1); }
  const U = [...us].sort((a, b) => a - b), V = [...vs].sort((a, b) => a - b);
  const pos = [], uv = [], idx = [];
  for (let i = 0; i < U.length - 1; i++) {
    for (let j = 0; j < V.length - 1; j++) {
      const uc = (U[i] + U[i + 1]) / 2, vc = (V[j] + V[j + 1]) / 2;
      if (vaos.some(o => uc > o.u0 && uc < o.u1 && vc > o.v0 && vc < o.v1)) continue;
      const base = pos.length / 3;
      for (const [u, v] of [[U[i], V[j]], [U[i + 1], V[j]], [U[i + 1], V[j + 1]], [U[i], V[j + 1]]]) {
        pos.push(...ponto(u, v).map(S)); uv.push(S(u), S(v));
      }
      idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, material);
  m.receiveShadow = true;
  return m;
}
const paredeX = (z, comprimento, altura, vaos) => superficie({ ponto: (u, v) => [u, v, z], comprimento, altura, vaos, material: mat.azulejo });
const paredeZ = (x, comprimento, altura, vaos) => superficie({ ponto: (u, v) => [x, v, u], comprimento, altura, vaos, material: mat.azulejo });

let rotulos = [];
function rotulo(grupo, texto, x, y, z, classe = '', quando = null) {
  const el = document.createElement('div');
  el.className = 'rotulo ' + classe;
  el.textContent = texto;
  const o = new CSS2DObject(el);
  o.position.set(S(x), S(y), S(z));
  o.userData.quando = quando;
  grupo.add(o);
  rotulos.push(o);
  return o;
}

function cotaChao(grupo, x, z0, z1, texto) {

// Lava-louças com porta que abre para baixo. Devolve o pivô da porta.
function lavaLoucas(grupo, ap, xCentro, yBase, folgas, corpo = mat.inox, folha = mat.inoxPorta) {
  const x0 = xCentro - ap.largura / 2, x1 = xCentro + ap.largura / 2, frente = folgas.frente;
  grupo.add(caixa(x0, x1, yBase + ap.dobradica, yBase + ap.altura, ap.folgaFundo, frente - 3, corpo));
  grupo.add(caixa(x0 + 1, x1 - 1, yBase, yBase + ap.dobradica, ap.folgaFundo + 2, frente - 5, mat.escuro, false));
  grupo.add(caixa(x0, x1, yBase + ap.dobradica + folgas.comp, yBase + ap.altura, frente - 3, frente, mat.escuro));
  grupo.add(caixa(x0 + 4, x0 + 16, yBase + ap.altura - 9, yBase + ap.altura - 5, frente, frente + 0.3, mat.cinzaClaro, false));
  const pivo = new THREE.Group();
  pivo.position.set(S(xCentro), S(yBase + ap.dobradica), S(frente));
  grupo.add(pivo);
  pivo.add(caixa(-ap.largura / 2, ap.largura / 2, 0, folgas.comp, -3, 0, folha));
  pivo.add(caixa(-ap.largura / 2 + 8, ap.largura / 2 - 8, folgas.comp - 7, folgas.comp - 4, 0, 1.6, mat.metal));
  return pivo;
}

// Midea Touch Plus com as faixas da foto de frente: rodapé, porta e painel.
function lavaLoucasMidea(grupo, ap, xCentro, yBase, folgas) {
  const x0 = xCentro - ap.largura / 2, x1 = xCentro + ap.largura / 2, frente = folgas.frente, lado = mat.cinzaMidea;
  const yPorta = yBase + ap.dobradica, yPainel = yPorta + folgas.comp;
  grupo.add(caixa(x0, x1, yBase, yPorta, ap.folgaFundo, frente, comFoto('midea', RECORTE_MIDEA.rodape, 1, lado)));
  grupo.add(caixa(x0, x1, yPorta, yPainel, ap.folgaFundo, frente - 3, lado));
  grupo.add(caixa(x0, x1, yPainel, yBase + ap.altura, ap.folgaFundo, frente, comFoto('midea', 0, RECORTE_MIDEA.painel, lado)));
  const pivo = new THREE.Group();
  pivo.position.set(S(xCentro), S(yPorta), S(frente));

}

  // Cilindro deitado: a tampa de cima vira a frente da porta e a de baixo, o verso.

  const cenarioPiso = () => cenarioAtivo() === 'reforma' && varianteAtiva() === 'piso';

  // Plano A: lava-louças de piso de 10 serviços no nicho do meio
  gPiso = new THREE.Group();
  gReforma.add(gPiso);

  rotulo(gPiso, F.ll.sobra >= 0 ? `sobram ≈ ${fmt(F.ll.sobra)} cm` : 'encosta na parede',
    (xLL0 + xLL1) / 2, 22, W - 6, situacao(F.ll.sobra), () => cenarioPiso() && abertas());
  cotaChao(gPiso, xAC0 + 10, W - F.corredorPiso, W, `≈ ${fmt(F.corredorPiso)} cm livres`);

  // Plano B: lava-louças de bancada de 8 serviços em cima da pedra; o nicho vira armário
  gBancadaLL = new THREE.Group();

  }

  cotaChao(gBancadaLL, xAC0 + 10, W - F.corredorBancada, W, `≈ ${fmt(F.corredorBancada)} cm livres`);

  // ---------- Cenário: hoje ----------
  gHoje = new THREE.Group();

  for (const x of [Fo.inicio + 1, Fo.inicio + Fo.largura - 1]) {

  }
  for (const y of [3, 38]) gHoje.add(caixa(Fo.inicio, Fo.inicio + Fo.largura, y, y + 1, 3, 3 + Fo.profundidade, mat.arame));
  gHoje.add(caixa(Fo.inicio, Fo.inicio + Fo.largura, Fo.alturaSuporte, Fo.alturaSuporte + Fo.alturaForno, 3, 3 + Fo.profundidade, mat.branco));
  gHoje.add(caixa(Fo.inicio + 2, Fo.inicio + Fo.largura - 9, Fo.alturaSuporte + 3, Fo.alturaSuporte + Fo.alturaForno - 3, 3 + Fo.profundidade, 3.6 + Fo.profundidade, mat.escuro));

  gHoje.add(caixa(Ta.inicio + 4, Ta.inicio + Ta.largura - 4, Ta.alturaBorda, Ta.alturaBorda + 0.3, 4, Ta.profundidade - 4, mat.tanqueFundo, false));
  gHoje.add(caixa(Ta.inicio + Ta.largura / 2 - 1, Ta.inicio + Ta.largura / 2 + 1, Ta.alturaBorda + 22, Ta.alturaBorda + 25, 0, 10, mat.metal));
  rotulo(gHoje, 'Tanque', Ta.inicio + Ta.largura / 2, Ta.alturaBorda + 34, Ta.profundidade / 2);

  gHoje.add(caixa(Sa.inicio, Sa.fim, 0, Sa.altura, Sa.z0, Sa.z1, mat.sapateira));
  gHoje.add(caixa(Lx.inicio, Lx.fim, 0, Lx.altura, Lx.z0, Lx.z1, mat.lixeira));
  cotaChao(gHoje, Ma.inicio + Ma.largura / 2, zMaq1, W, `≈ ${fmt(F.corredorHoje)} cm livres`);

  // ---------- Pessoa de 1,60 m para dar escala ----------
  pessoa = new THREE.Group();
  const raio = 16, cabeca = 12, alturaCorpo = M.pessoa.altura - 2 * cabeca - 4;
  const tronco = new THREE.Mesh(new THREE.CapsuleGeometry(S(raio), S(alturaCorpo - 2 * raio), 6, 16), mat.pessoa);
  tronco.scale.z = 0.6;
  tronco.position.y = S(alturaCorpo / 2);
  const bola = new THREE.Mesh(new THREE.SphereGeometry(S(cabeca), 20, 14), mat.pessoa);
  bola.position.y = S(M.pessoa.altura - cabeca);
  pessoa.add(tronco, bola);
  pessoa.position.set(S(M.pessoa.x), 0, S(W - F.corredorPiso / 2));
  conteudo.add(pessoa);
  rotulo(pessoa, 'pessoa de 1,60 m', 0, M.pessoa.altura + 10, 0, 'sutil');

  aplicarEstado();
}

// Visibilidade e posição das portas conforme o cenário e a vista escolhidos.
function aplicarEstado() {
  gReforma.visible = cenarioAtivo() === 'reforma';
  gHoje.visible = cenarioAtivo() === 'hoje';
  gPiso.visible = varianteAtiva() === 'piso';
  gBancadaLL.visible = varianteAtiva() === 'bancada';
  pessoa.visible = vistaAtual !== 'frente' && vistaAtual !== 'janela'; // nessas vistas a pessoa taparia a bancada
  aereos.visible = vistaAtual !== 'cima';
  aplicarPortas(suave(progressoPortas));
}
function aplicarPortas(p) {
  pivoLS.rotation.y = THREE.MathUtils.degToRad(F.ls.angulo) * p;
  pivoLL.rotation.x = THREE.MathUtils.degToRad(F.ll.angulo) * p;
  pivoLB.rotation.x = THREE.MathUtils.degToRad(F.lb.angulo) * p;
}
const suave = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

// ---------- Vistas ----------
// A cena é centralizada na área que o painel deixa livre.
let largura = 1, altura = 1, livre = { w: 1, h: 1 };
const painel = document.getElementById('painel'), mostrar = document.getElementById('mostrar'), topo = document.querySelector('.topo');
const telaLarga = window.matchMedia('(min-width: 860px)');
function atualizarAreaLivre() {
  let x0 = 0, x1 = largura, y0 = topo.offsetTop + topo.offsetHeight + 8, y1 = altura;
  if (!painel.hidden) {
    if (telaLarga.matches) { x0 = painel.offsetLeft + painel.offsetWidth + 8; y0 = 0; }
    else y1 = painel.offsetTop - 8;
  }
  livre = { w: Math.max(80, x1 - x0), h: Math.max(80, y1 - y0) };
  const dx = (x0 + x1) / 2 - largura / 2, dy = (y0 + y1) / 2 - altura / 2;
  camera.setViewOffset(largura, altura, -dx, -dy, largura, altura);
}
const fovInterno = () => THREE.MathUtils.clamp(
  2 * THREE.MathUtils.radToDeg(Math.atan(Math.tan(THREE.MathUtils.degToRad(33)) * altura / livre.w)), 62, 90);
function enquadrar(alvo, direcao, larguraCena, alturaCena, fov) {
  const t = Math.tan(THREE.MathUtils.degToRad(fov) / 2);
  const tv = t * livre.h / altura, th = t * livre.w / altura;
  const d = Math.max(alturaCena / 2 / tv, larguraCena / 2 / th) * 1.08;
  return { pos: alvo.clone().add(direcao.clone().normalize().multiplyScalar(d)), alvo, fov };
}
const retrato = () => livre.w < livre.h;
const VISTAS = {
  geral: () => retrato()
    ? enquadrar(v3(S(L * 0.55), S(70), S(W * 0.45)), v3(-0.8, 1.05, 0.75), 2.2, 2.6, 45)
    : enquadrar(v3(S(L * 0.5), S(80), S(W * 0.45)), v3(0.25, 0.85, 1), 3.4, 2.2, 45),
  cozinha: () => ({ pos: v3(S(25), S(158), S(W * 0.62)), alvo: v3(S(L - 20), S(80), S(25)), fov: fovInterno() }),
  frente: () => enquadrar(v3(S(B.inicio + B.comprimento / 2), S(95), S(B.profundidade / 2)), v3(0, 0.12, 1), S(B.comprimento + 40), 2.1, 40),
  janela: () => ({ pos: v3(S(L - 12), S(155), S(W * 0.78)), alvo: v3(S(60), S(70), S(W * 0.35)), fov: fovInterno() }),
  cima: () => {
    const alvo = v3(S(L / 2), 0, S((W - 60) / 2));
    return retrato()
      ? enquadrar(alvo, v3(0.002, 1, 0), S(W + 100), S(L + 40), 24)
      : enquadrar(alvo, v3(0, 1, 0.002), S(L + 40), S(W + 100), 24);
  },
};
const reduzirMovimento = window.matchMedia('(prefers-reduced-motion: reduce)');
function irPara(nome, instantaneo = false) {
  vistaAtual = nome;
  usuarioMexeu = false;
  aplicarEstado();
  const v = VISTAS[nome]();
  v.pos.multiply(ESPELHO);
  v.alvo.multiply(ESPELHO);
  document.querySelectorAll('[data-vista]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.vista === nome)));
  if (instantaneo || reduzirMovimento.matches) {
    camera.position.copy(v.pos); controles.target.copy(v.alvo);
    camera.fov = v.fov; camera.updateProjectionMatrix();
    transicao = null;
    return;
  }
  transicao = { t: 0, de: { pos: camera.position.clone(), alvo: controles.target.clone(), fov: camera.fov }, para: v };
}
controles.addEventListener('start', () => { usuarioMexeu = true; transicao = null; });

// ---------- Cenário, tipo de lava-louças e portas ----------
const botaoPortas = document.getElementById('portas');
function definirCenario(nome) {
  cenario = nome;
  document.getElementById('cenario-hoje').setAttribute('aria-pressed', String(nome === 'hoje'));
  document.getElementById('cenario-reforma').setAttribute('aria-pressed', String(nome === 'reforma'));
  document.getElementById('linha-variante').hidden = nome !== 'reforma';
  atualizarBotaoPortas();
  aplicarEstado();
  atualizarPainel();
}
function atualizarBotaoPortas() {
  botaoPortas.disabled = cenarioAtivo() !== 'reforma';
  if (botaoPortas.disabled) definirPortas(false);
}
function definirAba(nome) {
  aba = nome;
  for (const id of ['simulacao', 'escolhidos']) {
    const ativa = id === nome, botao = document.getElementById(`aba-${id}`);
    botao.setAttribute('aria-selected', String(ativa));
    botao.tabIndex = ativa ? 0 : -1;
    document.getElementById(`conteudo-${id}`).hidden = !ativa;
  }
  atualizarBotaoPortas();
  construir();
  atualizarPainel();
  if (nome === 'escolhidos') irPara('frente');
}
function definirPosicao(nome) {
  posicaoLL = nome;
  document.getElementById('posicao-cima').setAttribute('aria-pressed', String(nome === 'cima'));
  document.getElementById('posicao-baixo').setAttribute('aria-pressed', String(nome === 'baixo'));
  construir();
  atualizarPainel();
}
function definirVariante(nome) {
  variante = nome;
  document.getElementById('variante-piso').setAttribute('aria-pressed', String(nome === 'piso'));
  document.getElementById('variante-bancada').setAttribute('aria-pressed', String(nome === 'bancada'));
  aplicarEstado();
  atualizarPainel();
}
function definirPortas(abrir) {
  alvoPortas = abrir ? 1 : 0;
  botaoPortas.setAttribute('aria-pressed', String(abrir));
  botaoPortas.textContent = abrir ? 'Fechar as portas dos aparelhos' : 'Abrir as portas dos aparelhos';
}

// ---------- Painel ----------
const textosChip = { ok: 'folgado', justo: 'justo', limite: 'no limite' };
function itemResultado(nome, valor, classe, chip, detalhe) {
  const li = document.createElement('li');
  const n = document.createElement('span'); n.className = 'nome'; n.textContent = nome;
  const v = document.createElement('span'); v.className = 'valor'; v.textContent = valor;
  if (chip) { const c = document.createElement('span'); c.className = 'chip ' + classe; c.textContent = chip; v.append(c); }
  const d = document.createElement('span'); d.className = 'detalhe'; d.textContent = detalhe;
  li.append(n, v, d);
  return li;
}
const textoSobra = s => s >= 0 ? `sobram ≈ ${fmt(s)} cm` : 'encosta';
const metros = cm => (cm / 100).toFixed(2).replace('.', ',');
function atualizarPainel() {
  document.getElementById('subtitulo').textContent = `Simulação aproximada · ${metros(B.comprimento)} m × ${metros(W)} m`;
  const ul = document.getElementById('resultados');
  ul.replaceChildren();
  atualizarCartoes();
  if (cenario === 'hoje') {
    ul.append(itemResultado('Corredor hoje', `≈ ${fmt(F.corredorHoje)} cm`, 'ok', 'passa 1 pessoa',
      'Da frente da máquina atual até a parede da porta.'));
    return;
  }
  const corredor = variante === 'piso' ? F.corredorPiso : F.corredorBancada;
  const sCor = corredor >= 45 ? 'ok' : corredor >= 35 ? 'justo' : 'limite';
  ul.append(itemResultado('Corredor com tudo fechado', `≈ ${fmt(corredor)} cm`, sCor, { ok: 'passa 1 pessoa', justo: 'apertado', limite: 'muito estreito' }[sCor],
    `Da frente da bancada (${fmt(B.profundidade)} cm de fundo) até a parede da porta.`));
  const sLS = situacao(F.ls.sobra);
  ul.append(itemResultado('Lava e seca aberta', textoSobra(F.ls.sobra), sLS, textosChip[sLS],
    `Com a porta aberta, ocupa ≈ ${fmt(F.ls.ponta)} cm a partir da parede de trás.`));
  if (variante === 'piso') {
    const sLL = situacao(F.ll.sobra);
    ul.append(itemResultado('Lava-louças aberta', textoSobra(F.ll.sobra), sLL, textosChip[sLL],
      F.ll.sobra >= 0
        ? `Com a porta deitada, ocupa ≈ ${fmt(F.ll.ponta)} cm a partir da parede de trás.`
        : `A porta deitada precisaria de ≈ ${fmt(F.ll.ponta)} cm e o corredor tem ${fmt(W)}. Ela para em ≈ ${fmt(F.ll.angulo)}°, quase deitada.`));
  } else {
    const sLB = situacao(F.lb.sobra);
    ul.append(itemResultado('Lava-louças de bancada aberta', textoSobra(F.lb.sobra), sLB, textosChip[sLB],
      `A porta abre na altura da bancada. A máquina ocupa ${fmt(M.reforma.lavaLoucasBancada.largura)} cm da pedra e o nicho de baixo vira armário.`));
  }
}
// Fichas dos aparelhos escolhidos, com as contas da montagem atual.
function cartao({ nome, modelo, loja, foto, alt }, linhas) {
  const art = document.createElement('article'); art.className = 'cartao';
  const img = document.createElement('img'); img.src = foto; img.alt = alt; img.loading = 'lazy';
  const texto = document.createElement('div'); texto.className = 'texto';
  const h = document.createElement('h2'); h.textContent = nome;
  const m = document.createElement('p'); m.className = 'modelo'; m.textContent = modelo;
  const dl = document.createElement('dl');
  for (const [rotuloLinha, valor, classe, selo] of linhas) {
    const dt = document.createElement('dt'); dt.textContent = rotuloLinha;
    const dd = document.createElement('dd'); dd.textContent = valor;
    if (classe) { const c = document.createElement('span'); c.className = 'chip ' + classe; c.textContent = selo || textosChip[classe]; dd.append(c); }
    dl.append(dt, dd);
  }
  const a = document.createElement('a'); a.href = loja; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Ver na loja';
  texto.append(h, m, dl, a);
  art.append(img, texto);
  return art;
}
const cm = n => `${String(Math.round(n * 10) / 10).replace('.', ',')} cm`;
function atualizarCartoes() {
  const ls = M.reforma.lavaSeca, lb = M.reforma.lavaLoucasBancada;
  const sobraLadoLS = (M.reforma.nichoLavaSeca - ls.largura) / 2, sobraCimaLS = B.alturaLivre - ls.altura;
  const ateArmario = M.armariosAereos.base - (B.alturaLivre + B.espessura) - lb.altura;
  const sobraLadoLL = (M.reforma.nichoLavaLoucas - lb.largura) / 2, sobraCimaLL = B.alturaLivre - lb.altura;
  document.getElementById('cartoes').replaceChildren(
    cartao(ESCOLHIDOS.lavaSeca, [
      ['Tamanho', `${fmt(ls.largura)} × ${fmt(ls.altura)} × ${fmt(ls.profundidade)} cm (L × A × P)`],
      ['No nicho', `sobra ${cm(sobraLadoLS)} de cada lado e ${cm(sobraCimaLS)} até a pedra`, ...(Math.min(sobraLadoLS, sobraCimaLS) >= 2 ? ['ok', 'cabe'] : ['limite', 'não cabe'])],
      ['Porta aberta', textoSobra(F.ls.sobra) + ' até a parede da frente', situacao(F.ls.sobra)],
    ]),
    cartao(ESCOLHIDOS.lavaLoucas, [
      ['Tamanho', `${fmt(lb.largura)} × ${cm(lb.altura).replace(' cm', '')} × ${fmt(lb.profundidade)} cm (L × A × P)`],
      ...(posicaoLL === 'baixo' ? [
        ['Embaixo da pedra', `nicho de ${fmt(M.reforma.nichoLavaLoucas)} cm: sobra ${cm(sobraLadoLL)} de cada lado e ${cm(sobraCimaLL)} até a pedra`, ...(sobraLadoLL >= 1 && sobraCimaLL >= 0 ? ['ok', 'cabe'] : ['limite', 'não cabe'])],
        ['Porta aberta', textoSobra(F.lb.sobra) + ' até a parede da frente (porta medida pela foto)', situacao(F.lb.sobra)],
        ['Armário da cuba', `diminui de 85 para ${fmt(M.reforma.armarioCuba)} cm`],
        ['Em cima da pedra', 'a bancada fica toda livre'],
      ] : [
        ['Em cima da pedra', `ficam ${cm(ateArmario)} até os armários de cima`, ...(ateArmario >= 10 ? ['ok', 'cabe'] : ateArmario >= 0 ? ['justo', 'justo'] : ['limite', 'não cabe'])],
        ['Porta aberta', textoSobra(F.lb.sobra) + ' até a parede da frente (porta medida pela foto)', situacao(F.lb.sobra)],
        ['Embaixo', `o nicho de ${fmt(M.reforma.nichoLavaLoucas)} cm vira armário`],
      ]),
    ]),
  );
  document.getElementById('nota-escolhidos').textContent = posicaoLL === 'baixo'
    ? 'A lava e seca e a lava-louças lado a lado, embaixo da pedra. Para a lava-louças de 55 cm caber, o nicho dela passa de 50 para 57 cm e o armário da cuba encolhe de 85 para 78 cm.'
    : 'A lava e seca embaixo da pedra e a lava-louças em cima dela, ao lado da cuba. Medidas do fabricante.';
}

document.getElementById('nota-medidas').textContent =
  'Medidas aproximadas, para ter noção do espaço. Aparelhos com medidas de catálogo: lava e seca Samsung WD11M (60 × 85 × 65 cm), ' +
  'lava-louças de piso de 10 serviços (45 × 85 × 60 cm) e lava-louças de bancada Midea Touch Plus (55 × 59,5 × 50 cm). ' +
  'A lava-louças de piso aberta usa a média dos fabricantes (115 a 120 cm); a porta da Midea foi medida pela proporção da foto. Confira no manual do modelo escolhido.';

// ---------- E se…? (ajuste de medidas) ----------
const campos = document.getElementById('campos');
const restaurar = document.getElementById('restaurar');
const entradas = {};
for (const a of AJUSTES) {
  const campo = document.createElement('div'); campo.className = 'campo';
  const rotuloCampo = document.createElement('label'); rotuloCampo.htmlFor = `aj-${a.id}`; rotuloCampo.textContent = a.nome;
  const saida = document.createElement('output'); saida.htmlFor = `aj-${a.id}`;
  const entrada = document.createElement('input');
  Object.assign(entrada, { type: 'range', id: `aj-${a.id}`, min: a.min, max: a.max, step: 1, value: ajustes[a.id] });
  const ajuda = document.createElement('p'); ajuda.className = 'ajuda'; ajuda.textContent = a.ajuda;
  campo.append(rotuloCampo, saida, entrada, ajuda);
  campos.append(campo);
  entradas[a.id] = { entrada, saida };
  entrada.addEventListener('input', () => {
    ajustes[a.id] = Number(entrada.value);
    salvarAjustes();
    atualizarCampos();
    agendarMontagem();
  });
}
function atualizarCampos() {
  for (const a of AJUSTES) {
    const { entrada, saida } = entradas[a.id];
    entrada.value = ajustes[a.id];
    saida.textContent = `${ajustes[a.id]} cm`;
  }
  restaurar.disabled = AJUSTES.every(a => ajustes[a.id] === PADRAO[a.id]);
}
restaurar.addEventListener('click', () => {
  ajustes = { ...PADRAO };
  salvarAjustes();
  atualizarCampos();
  agendarMontagem();
});
let montagemAgendada = false;
function agendarMontagem() {
  if (montagemAgendada) return;
  montagemAgendada = true;
  requestAnimationFrame(() => {
    montagemAgendada = false;
    construir();
    atualizarPainel();
    if (!usuarioMexeu) irPara(vistaAtual, true);
  });
}

// ---------- Botões ----------
document.getElementById('posicao-cima').addEventListener('click', () => definirPosicao('cima'));
document.getElementById('posicao-baixo').addEventListener('click', () => definirPosicao('baixo'));
document.getElementById('aba-simulacao').addEventListener('click', () => definirAba('simulacao'));
document.getElementById('aba-escolhidos').addEventListener('click', () => definirAba('escolhidos'));
document.querySelector('.abas').addEventListener('keydown', evento => {
  if (evento.key !== 'ArrowLeft' && evento.key !== 'ArrowRight') return;
  const proxima = aba === 'simulacao' ? 'escolhidos' : 'simulacao';
  definirAba(proxima);
  document.getElementById(`aba-${proxima}`).focus();
});
document.getElementById('cenario-hoje').addEventListener('click', () => definirCenario('hoje'));
document.getElementById('cenario-reforma').addEventListener('click', () => definirCenario('reforma'));
document.getElementById('variante-piso').addEventListener('click', () => definirVariante('piso'));
document.getElementById('variante-bancada').addEventListener('click', () => definirVariante('bancada'));
botaoPortas.addEventListener('click', () => definirPortas(alvoPortas === 0));
document.querySelectorAll('[data-vista]').forEach(b => b.addEventListener('click', () => irPara(b.dataset.vista)));
const botaoNomes = document.getElementById('nomes');
botaoNomes.addEventListener('click', () => {
  mostrarNomes = !mostrarNomes;
  botaoNomes.setAttribute('aria-pressed', String(mostrarNomes));
  botaoNomes.textContent = mostrarNomes ? 'Esconder nomes' : 'Mostrar nomes';
});
document.getElementById('esconder').addEventListener('click', () => { painel.hidden = true; mostrar.hidden = false; mostrar.focus(); });
mostrar.addEventListener('click', () => { painel.hidden = false; mostrar.hidden = true; });

// ---------- Tema ----------
function aplicarTema() {
  const cor = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  cena.background = new THREE.Color(cor || '#e8ecec');
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicarTema);
new MutationObserver(aplicarTema).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
aplicarTema();

// ---------- Tamanho da tela ----------
function redimensionar() {
  largura = container.clientWidth || window.innerWidth;
  altura = container.clientHeight || window.innerHeight;
  renderer.setSize(largura, altura);
  rotuloRenderer.setSize(largura, altura);
  camera.aspect = largura / altura;
  atualizarAreaLivre();
  camera.updateProjectionMatrix();
  if (!usuarioMexeu) irPara(vistaAtual, true);
}
window.addEventListener('resize', redimensionar);
new ResizeObserver(redimensionar).observe(painel);

// ---------- Laço de desenho ----------
const relogio = new THREE.Clock();
const tmp = new THREE.Vector3();
function visivel(o) { for (let p = o; p; p = p.parent) if (!p.visible) return false; return true; }
function quadro() {
  const dt = Math.min(relogio.getDelta(), 0.05);
  if (transicao) {
    transicao.t = Math.min(1, transicao.t + dt / 0.7);
    const k = suave(transicao.t), { de, para } = transicao;
    camera.position.lerpVectors(de.pos, para.pos, k);
    controles.target.lerpVectors(de.alvo, para.alvo, k);
    camera.fov = de.fov + (para.fov - de.fov) * k;
    camera.updateProjectionMatrix();
    if (transicao.t >= 1) transicao = null;
  }
  if (progressoPortas !== alvoPortas) {
    const passo = reduzirMovimento.matches ? 1 : dt / 0.9;
    progressoPortas = alvoPortas > progressoPortas ? Math.min(alvoPortas, progressoPortas + passo) : Math.max(alvoPortas, progressoPortas - passo);
    aplicarPortas(suave(progressoPortas));
  }
  controles.update();
  for (const p of paredes) p.grupo.visible = tmp.subVectors(camera.position, p.ponto).dot(p.normal) > -0.01;
  for (const r of rotulos) r.visible = mostrarNomes && visivel(r.parent) && (!r.userData.quando || r.userData.quando());
  renderer.render(cena, camera);
  rotuloRenderer.render(cena, camera);
  requestAnimationFrame(quadro);
}

construir();
atualizarCampos();
definirVariante('piso');
definirCenario('reforma');
definirPortas(false);
redimensionar();
window.__cenaPronta = true;
requestAnimationFrame(quadro);
</script>
