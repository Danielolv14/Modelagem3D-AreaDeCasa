<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Área de Serviço 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600&display=swap">
<style>
/* Layout: cena 3D em tela cheia; painel de controle por cima, embaixo no celular e à esquerda em telas largas. */
:root {
  --bg: #e8ecec;          /* fundo da cena: cinza de rejunte */
  --surface: #fbfcfb;
  --ink: #1c2a2e;
  --muted: #56676c;
  --line: #ccd6d7;
  --accent: #1d6470;      /* petróleo */
  --accent-ink: #ffffff;
  --focus: #e0a030;
  --shadow: rgba(20, 40, 45, 0.16);
  --veil: rgba(251, 252, 251, 0.88);
  --ok: #26703f;   --ok-bg: #dff1e5;
  --warn: #8a5800; --warn-bg: #fbedcf;
  --bad: #ad2a20;  --bad-bg: #fbe2df;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131a1c; --surface: #1c2629; --ink: #e5eef0; --muted: #9aabb0; --line: #2e3c40;
    --accent: #62b6c3; --accent-ink: #0c1a1d; --focus: #f0b54a; --shadow: rgba(0, 0, 0, 0.45); --veil: rgba(28, 38, 41, 0.88);
    --ok: #74c992; --ok-bg: #173022; --warn: #e6ae4f; --warn-bg: #34280f; --bad: #f28b82; --bad-bg: #3b1b18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131a1c; --surface: #1c2629; --ink: #e5eef0; --muted: #9aabb0; --line: #2e3c40;
  --accent: #62b6c3; --accent-ink: #0c1a1d; --focus: #f0b54a; --shadow: rgba(0, 0, 0, 0.45); --veil: rgba(28, 38, 41, 0.88);
  --ok: #74c992; --ok-bg: #173022; --warn: #e6ae4f; --warn-bg: #34280f; --bad: #f28b82; --bad-bg: #3b1b18;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }

#app { position: relative; height: 100%; overflow: hidden; }
#cena, #rotulos { position: absolute; inset: 0; }
#rotulos { pointer-events: none; z-index: 1; }
#cena canvas { display: block; touch-action: none; }
.carregando { position: absolute; inset: 0; display: grid; place-items: center; padding-inline: 16px; color: var(--muted); text-align: center; }

.topo {
  position: absolute; top: 12px; left: 16px; z-index: 2;
  width: fit-content; max-width: calc(100% - 32px);
  display: flex; flex-direction: column; gap: 2px;
  padding: 6px 12px 7px; border-radius: 10px; background: var(--veil);
  pointer-events: none;
}
.topo h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.4rem; letter-spacing: -0.01em; text-wrap: balance; }
.topo p { margin: 0; color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }

.painel {
  position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 2;
  display: flex; flex-direction: column; gap: 12px;
  max-height: 50%; overflow-y: auto;
  padding: 12px 14px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 10px 30px var(--shadow);
}
@media (min-width: 860px) {
  .painel { right: auto; width: 360px; top: 92px; max-height: none; }
}
.linha { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.linha.entre { justify-content: space-between; }

.segmentado { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.segmentado button {
  border: 0; border-radius: 7px; padding: 7px 12px;
  background: transparent; color: var(--ink);
  font: inherit; font-weight: 700; cursor: pointer;
}
.segmentado button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.botao {
  border: 1.5px solid var(--accent); border-radius: 10px; padding: 7px 12px;
  background: transparent; color: var(--accent);
  font: inherit; font-weight: 700; cursor: pointer;
}
.botao[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.botao:disabled { opacity: 0.45; cursor: not-allowed; }
.discreto { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 0.85rem; text-decoration: underline; cursor: pointer; padding: 4px; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.titulo-secao { margin: 0 0 6px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

.resultados { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.resultados li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; align-items: baseline; }
.resultados .nome { font-weight: 700; }
.resultados .valor { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.resultados .detalhe { grid-column: 1 / -1; color: var(--muted); font-size: 0.82rem; }
.chip { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.02em; }
.chip.ok { color: var(--ok); background: var(--ok-bg); }
.chip.justo { color: var(--warn); background: var(--warn-bg); }
.chip.limite { color: var(--bad); background: var(--bad-bg); }

.vistas { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.vistas button {
  flex: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  background: var(--bg); color: var(--ink); font: inherit; font-size: 0.85rem; cursor: pointer;
}
.vistas button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }

.nota { margin: 0; color: var(--muted); font-size: 0.78rem; }
@media (max-width: 599px) {
  .painel { max-height: 42%; gap: 10px; padding: 10px 12px 12px; }
  .resultados .detalhe { display: none; }
  .resultados { gap: 6px; }
}

.mostrar-painel {
  position: absolute; left: 16px; bottom: 16px; z-index: 2;
  border: 0; border-radius: 10px; padding: 9px 14px;
  background: var(--accent); color: var(--accent-ink);
  font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 6px 18px var(--shadow);
}

.rotulo {
  padding: 3px 7px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px var(--shadow);
  font-family: var(--font-body); font-size: 11.5px; line-height: 1.2; white-space: nowrap;
}
.rotulo.medida { border-color: transparent; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.rotulo.ok { border-color: transparent; background: var(--ok-bg); color: var(--ok); font-weight: 700; }
.rotulo.justo { border-color: transparent; background: var(--warn-bg); color: var(--warn); font-weight: 700; }
.rotulo.limite { border-color: transparent; background: var(--bad-bg); color: var(--bad); font-weight: 700; }
.rotulo.sutil { opacity: 0.85; font-size: 10.5px; }
</style>
</head>
<body>
<div id="app">
  <div id="cena"><div class="carregando" id="carregando">Carregando a área de serviço em 3D…</div></div>
  <div id="rotulos"></div>

  <header class="topo">
    <h1>Área de serviço</h1>
    <p>Simulação aproximada · 2,00 m × 1,20 m</p>
  </header>

  <section class="painel" id="painel" aria-label="Controles da simulação">
    <div class="linha entre">
      <div class="segmentado" role="group" aria-label="Cenário">
        <button type="button" id="cenario-hoje" aria-pressed="false">Hoje</button>
        <button type="button" id="cenario-reforma" aria-pressed="true">Com a reforma</button>
      </div>
      <button type="button" class="discreto" id="esconder">Esconder painel</button>
    </div>

    <div class="linha">
      <button type="button" class="botao" id="portas" aria-pressed="false">Abrir as portas dos aparelhos</button>
    </div>

    <div>
      <p class="titulo-secao">Espaço que sobra</p>
      <ul class="resultados" id="resultados"></ul>
    </div>

    <div>
      <p class="titulo-secao">Ver de</p>
      <div class="vistas" role="group" aria-label="Ponto de vista">
        <button type="button" data-vista="geral" aria-pressed="true">Visão geral</button>
        <button type="button" data-vista="cozinha" aria-pressed="false">Da cozinha</button>
        <button type="button" data-vista="frente" aria-pressed="false">De frente</button>
        <button type="button" data-vista="janela" aria-pressed="false">Da janela</button>
        <button type="button" data-vista="cima" aria-pressed="false">De cima</button>
      </div>
    </div>

    <div class="linha entre">
      <p class="nota">Arraste para girar · pinça ou rolagem para zoom</p>
      <button type="button" class="discreto" id="nomes" aria-pressed="true">Esconder nomes</button>
    </div>
    <p class="nota" id="nota-medidas"></p>
  </section>
  <button type="button" class="mostrar-painel" id="mostrar" hidden>Mostrar painel</button>
</div>

<script>
  // Se o 3D não carregar (sem internet ou navegador antigo), avisa em vez de ficar em branco.
  setTimeout(function () {
    if (!window.__cenaPronta) {
      var el = document.getElementById('carregando');
      if (el) el.textContent = 'Não foi possível carregar o 3D. Confira a internet e recarregue a página.';
    }
  }, 12000);
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ======================================================================
//  MEDIDAS (em cm). Tudo que é medida fica aqui.
//  Origem: canto da PAREDE CEGA com a PAREDE DOS ARMÁRIOS, no chão.
//  x: da parede cega até a janela · z: da parede dos armários até a
//  parede da porta · y: altura.  (E) = estimado pelas fotos.
// ======================================================================
const M = {
  comodo: { comprimento: 280, largura: 120, peDireito: 250 },        // comprimento (E): passagem + 2,00 m de bancada
  passagemCozinha: { inicio: 0, largura: 80, altura: 210 },          // (E) na parede dos armários
  portaPredio: { inicio: 6, largura: 72, altura: 210 },              // (E) na parede da porta, abre para dentro
  janela: { inicio: 12, largura: 75, altura: 110, peitoril: 100 },   // (E) início medido da parede da porta
  armariosAereos: { inicio: 80, fim: 280, profundidade: 35, base: 178, portas: 8 }, // (E)
  quadroLuz: { inicio: 112, largura: 30, base: 112, altura: 40 },    // (E)
  interfone: { inicio: 90, largura: 12, base: 165, altura: 15 },     // (E)
  interruptor: { inicio: 92, largura: 8, base: 104, altura: 12 },    // (E)
  varal: { inicio: 150, fim: 262, altura: 198 },                     // (E)
  azulejo: { largura: 33, altura: 45 },                              // (E) só visual
  piso: { lado: 60 },                                                // (E) só visual

  reforma: {
    bancada: { inicio: 80, comprimento: 200, profundidade: 70, alturaLivre: 87.5, espessura: 3, rodabanca: 10 },
    // Da passagem da cozinha para a janela:
    nichoLavaSeca: 65, nichoLavaLoucas: 50, armarioCuba: 85,
    lavaSeca: { largura: 60, altura: 85, profundidade: 65, portaAberta: 110, centroPorta: 48, folgaFundo: 3 },
    lavaLoucas: { largura: 44.8, altura: 84.5, profundidade: 60, portaAberta: 118, dobradica: 10, folgaFundo: 3 },
    cuba: { largura: 30, profundidade: 35 },
  },
  hoje: {
    forno: { inicio: 85, largura: 50, profundidade: 37, alturaSuporte: 75, alturaForno: 32 },  // (E)
    maquina: { inicio: 140, largura: 56, profundidade: 61, altura: 96, folgaFundo: 3 },      // (E) Consul 9 kg
    tanque: { inicio: 224, largura: 54, profundidade: 46, alturaBorda: 88 },                 // (E)
    sapateira: { inicio: 248, fim: 280, z0: 82, z1: 118, altura: 48 },                       // (E)
    lixeira: { inicio: 252, fim: 276, z0: 52, z1: 74, altura: 45 },                          // (E)
  },
  pessoa: { altura: 160, x: 230, z: 96 },
};

const L = M.comodo.comprimento, W = M.comodo.largura, H = M.comodo.peDireito;
const B = M.reforma.bancada;
const xLS0 = B.inicio, xLS1 = xLS0 + M.reforma.nichoLavaSeca;
const xLL0 = xLS1, xLL1 = xLL0 + M.reforma.nichoLavaLoucas;
const xAC0 = xLL1, xAC1 = xAC0 + M.reforma.armarioCuba;

// ---------- Contas de folga ----------
function calcularFolgas() {
  const ls = M.reforma.lavaSeca, ll = M.reforma.lavaLoucas, maq = M.hoje.maquina;
  const lsFrente = ls.folgaFundo + ls.profundidade - 5;   // frente do corpo (sem a porta)
  const lsPorta = ls.portaAberta - (ls.profundidade - 5); // diâmetro da porta
  const lsEspaco = W - lsFrente;
  const lsSobra = lsEspaco - lsPorta;
  const llFrente = ll.folgaFundo + ll.profundidade;
  const llPorta = ll.portaAberta - ll.profundidade;
  const llEspaco = W - llFrente;
  const llSobra = llEspaco - llPorta;
  const angulo = (espaco, porta) => espaco >= porta ? 90 : THREE.MathUtils.radToDeg(Math.asin(Math.max(0, espaco) / porta));
  return {
    corredor: W - B.profundidade,
    corredorHoje: W - (maq.folgaFundo + maq.profundidade),
    lsFrente, lsPorta, lsSobra, lsAngulo: angulo(lsEspaco, lsPorta), lsPonta: ls.folgaFundo + ls.portaAberta,
    llFrente, llPorta, llSobra, llAngulo: angulo(llEspaco, llPorta), llPonta: ll.folgaFundo + ll.portaAberta,
  };
}
const F = calcularFolgas();
const situacao = sobra => sobra >= 15 ? 'ok' : sobra >= 0 ? 'justo' : 'limite';
const fmt = n => Math.round(n).toLocaleString('pt-BR');

// ---------- Renderizador ----------
const S = v => v / 100; // cm → m
const container = document.getElementById('cena');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (erro) {
  document.getElementById('carregando').textContent = 'Este navegador não conseguiu abrir o 3D. Tente pelo Chrome ou Safari atualizados.';
  throw erro;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('carregando').remove();
container.appendChild(renderer.domElement);
const rotuloRenderer = new CSS2DRenderer({ element: document.getElementById('rotulos') });

const cena = new THREE.Scene();
// O modelo é escrito com z crescendo da parede dos armários para a parede da porta.
// Espelhar z deixa a cena igual às fotos: de frente para a bancada, a janela fica à esquerda.
const ESPELHO = new THREE.Vector3(1, 1, -1);
const mundo = new THREE.Group();
mundo.scale.copy(ESPELHO);
cena.add(mundo);
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 60);
const controles = new OrbitControls(camera, renderer.domElement);
controles.enableDamping = true;
controles.dampingFactor = 0.08;
controles.maxPolarAngle = Math.PI * 0.5;
controles.minDistance = 0.3;
controles.maxDistance = 14;

// ---------- Luz ----------
mundo.add(new THREE.HemisphereLight(0xffffff, 0xcdc4b3, 2.1));
const sol = new THREE.DirectionalLight(0xfff4e2, 2.2);
sol.position.set(S(L + 150), S(330), S(W * 0.7));
sol.target.position.set(S(L / 2), 0, S(W / 2));
sol.castShadow = true;
sol.shadow.mapSize.set(1024, 1024);
Object.assign(sol.shadow.camera, { left: -2.4, right: 2.4, top: 2.4, bottom: -2.4, near: 0.5, far: 9 });
sol.shadow.bias = -0.0004;
sol.shadow.normalBias = 0.02;
mundo.add(sol, sol.target);
const preenchimento = new THREE.DirectionalLight(0xffffff, 0.7);
preenchimento.position.set(S(L * 0.3), S(400), S(W * 3));
mundo.add(preenchimento);

// ---------- Texturas ----------
function texturaAzulejo(largura, altura, cor, rejunte) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = Math.round(256 * altura / largura);
  const g = c.getContext('2d');
  g.fillStyle = cor; g.fillRect(0, 0, c.width, c.height);
  g.strokeStyle = rejunte; g.lineWidth = 4; g.strokeRect(0, 0, c.width, c.height);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  t.repeat.set(100 / largura, 100 / altura); // UV em metros
  return t;
}
function texturaGranito() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#545a5e'; g.fillRect(0, 0, 512, 512);
  const cores = ['#3a3f42', '#6a7175', '#7f8586', '#454b4e', '#90938f'];
  for (let i = 0; i < 9000; i++) {
    g.fillStyle = cores[i % cores.length];
    g.globalAlpha = 0.25 + Math.random() * 0.35;
    g.fillRect(Math.random() * 512, Math.random() * 512, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  t.repeat.set(2, 1);
  return t;
}

// ---------- Materiais ----------
const padrao = (cor, extra = {}) => new THREE.MeshStandardMaterial({ color: cor, roughness: 0.5, ...extra });
const mat = {
  azulejo: new THREE.MeshStandardMaterial({ map: texturaAzulejo(M.azulejo.largura, M.azulejo.altura, '#f6f6f3', '#d3d6d2'), roughness: 0.35, side: THREE.DoubleSide }),
  teto: padrao(0xf7f7f4, { roughness: 0.95, side: THREE.DoubleSide }),
  liso: padrao(0xf1f1ee, { roughness: 0.6 }),
  madeira: padrao(0x8f4520, { roughness: 0.55 }),
  folhaPorta: padrao(0xa5552a, { roughness: 0.5 }),
  armario: padrao(0xf2f0ea, { roughness: 0.25 }),
  armarioPorta: padrao(0xf6f4ee, { roughness: 0.22 }),
  friso: padrao(0xb6b2a8, { roughness: 0.7 }),
  metal: padrao(0xc9ced1, { roughness: 0.3, metalness: 0.7 }),
  inox: padrao(0xbfc5c8, { roughness: 0.32, metalness: 0.55 }),
  inoxPorta: padrao(0xd0d5d7, { roughness: 0.28, metalness: 0.55 }),
  branco: padrao(0xf4f5f6, { roughness: 0.4 }),
  cinzaClaro: padrao(0xd9dcde, { roughness: 0.5 }),
  escuro: padrao(0x2d3236, { roughness: 0.5 }),
  vidro: padrao(0x56707c, { roughness: 0.08, transparent: true, opacity: 0.88 }),
  vidroJanela: new THREE.MeshStandardMaterial({ color: 0xbcd8e4, roughness: 0.05, transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false }),
  aluminio: padrao(0xdcdfe1, { roughness: 0.4, metalness: 0.3 }),
  pedra: new THREE.MeshStandardMaterial({ map: texturaGranito(), roughness: 0.28 }),
  peitoril: padrao(0xe7e3da, { roughness: 0.4 }),
  quadro: padrao(0xd2d0c3, { roughness: 0.6 }),
  tanque: padrao(0xece5d3, { roughness: 0.5 }),
  tanqueFundo: padrao(0xd8cdb2, { roughness: 0.6 }),
  arame: padrao(0x8d9396, { roughness: 0.45, metalness: 0.5 }),
  sapateira: padrao(0x2e3134, { roughness: 0.6, transparent: true, opacity: 0.7 }),
  lixeira: padrao(0x7c8a90, { roughness: 0.5 }),
  pessoa: new THREE.MeshStandardMaterial({ color: 0x5c7a86, roughness: 0.85, transparent: true, opacity: 0.5, depthWrite: false }),
  cozinha: padrao(0xd8d1c1, { roughness: 0.9 }),
  cota: new THREE.MeshBasicMaterial({ color: 0x1d6470 }),
};

// ---------- Ajudantes ----------
const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
// Caixa definida pelos limites em cm, no sistema do grupo onde for colocada.
function caixa(x0, x1, y0, y1, z0, z1, material, sombra = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(S(x1 - x0), S(y1 - y0), S(z1 - z0)), material);
  m.position.set(S((x0 + x1) / 2), S((y0 + y1) / 2), S((z0 + z1) / 2));
  m.castShadow = sombra; m.receiveShadow = true;
  return m;
}
// Parede plana com vãos (porta, janela, passagem). UV em metros para o azulejo ficar no tamanho certo.
function parede({ origem, dirU, comprimento, altura, vaos = [], material }) {
  const us = new Set([0, comprimento]), vs = new Set([0, altura]);
  for (const o of vaos) { us.add(o.u0); us.add(o.u1); vs.add(o.v0); vs.add(o.v1); }
  const U = [...us].sort((a, b) => a - b), V = [...vs].sort((a, b) => a - b);
  const pos = [], uv = [], idx = [];
  const ponto = (u, v) => [S(origem[0] + dirU[0] * u), S(v), S(origem[2] + dirU[2] * u)];
  for (let i = 0; i < U.length - 1; i++) {
    for (let j = 0; j < V.length - 1; j++) {
      const uc = (U[i] + U[i + 1]) / 2, vc = (V[j] + V[j + 1]) / 2;
      if (vaos.some(o => uc > o.u0 && uc < o.u1 && vc > o.v0 && vc < o.v1)) continue;
      const base = pos.length / 3;
      for (const [u, v] of [[U[i], V[j]], [U[i + 1], V[j]], [U[i + 1], V[j + 1]], [U[i], V[j + 1]]]) {
        pos.push(...ponto(u, v)); uv.push(S(u), S(v));
      }
      idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, material);
  m.receiveShadow = true;
  return m;
}
const rotulos = [];
function rotulo(grupo, texto, x, y, z, classe = '', quando = null) {
  const el = document.createElement('div');
  el.className = 'rotulo ' + classe;
  el.textContent = texto;
  const o = new CSS2DObject(el);
  o.position.set(S(x), S(y), S(z));
  o.userData.quando = quando;
  grupo.add(o);
  rotulos.push(o);
  return o;
}
// Cota no chão, ao longo de z.
function cotaChao(grupo, x, z0, z1, texto) {
  grupo.add(caixa(x - 0.6, x + 0.6, 0.2, 0.6, z0, z1, mat.cota, false));
  grupo.add(caixa(x - 5, x + 5, 0.2, 0.6, z0, z0 + 1, mat.cota, false));
  grupo.add(caixa(x - 5, x + 5, 0.2, 0.6, z1 - 1, z1, mat.cota, false));
  rotulo(grupo, texto, x, 4, (z0 + z1) / 2, 'medida');
}

let largura = 1, altura = 1, livre = { w: 1, h: 1 };
const painel = document.getElementById('painel'), mostrar = document.getElementById('mostrar'), topo = document.querySelector('.topo');
const telaLarga = window.matchMedia('(min-width: 860px)');
function atualizarAreaLivre() {
  let x0 = 0, x1 = largura, y0 = topo.offsetTop + topo.offsetHeight + 8, y1 = altura;
  if (!painel.hidden) {
    if (telaLarga.matches) { x0 = painel.offsetLeft + painel.offsetWidth + 8; y0 = 0; }
    else y1 = painel.offsetTop - 8;
  }
  livre = { w: Math.max(80, x1 - x0), h: Math.max(80, y1 - y0) };
  const dx = (x0 + x1) / 2 - largura / 2, dy = (y0 + y1) / 2 - altura / 2;
  camera.setViewOffset(largura, altura, -dx, -dy, largura, altura);
}
const fovInterno = () => THREE.MathUtils.clamp(
  2 * THREE.MathUtils.radToDeg(Math.atan(Math.tan(THREE.MathUtils.degToRad(33)) * altura / livre.w)), 62, 90);
function enquadrar(alvo, direcao, larguraCena, alturaCena, fov) {
  const t = Math.tan(THREE.MathUtils.degToRad(fov) / 2);
  const tv = t * livre.h / altura, th = t * livre.w / altura;
  const d = Math.max(alturaCena / 2 / tv, larguraCena / 2 / th) * 1.08;
  return { pos: alvo.clone().add(direcao.clone().normalize().multiplyScalar(d)), alvo, fov };
}
const retrato = () => livre.w < livre.h;
const VISTAS = {
  geral: () => retrato()
    ? enquadrar(v3(S(L * 0.55), S(70), S(W * 0.45)), v3(-0.8, 1.05, 0.75), 2.2, 2.6, 45)
    : enquadrar(v3(S(L * 0.5), S(80), S(W * 0.45)), v3(0.25, 0.85, 1), 3.4, 2.2, 45),
  cozinha: () => ({ pos: v3(S(25), S(158), S(W * 0.62)), alvo: v3(S(L - 20), S(80), S(25)), fov: fovInterno() }),
  frente: () => enquadrar(v3(S(B.inicio + B.comprimento / 2), S(95), S(B.profundidade / 2)), v3(0, 0.12, 1), S(B.comprimento + 40), 2.1, 40),
  janela: () => ({ pos: v3(S(L - 12), S(155), S(W * 0.78)), alvo: v3(S(60), S(70), S(W * 0.35)), fov: fovInterno() }),
  cima: () => {
    const alvo = v3(S(L / 2), 0, S((W - 60) / 2));
    const vista = retrato()
      ? enquadrar(alvo, v3(0.002, 1, 0), S(W + 100), S(L + 40), 24)
      : enquadrar(alvo, v3(0, 1, 0.002), S(L + 40), S(W + 100), 24);
    return vista;
  },
};
let vistaAtual = 'geral', usuarioMexeu = false, transicao = null;
const reduzirMovimento = window.matchMedia('(prefers-reduced-motion: reduce)');
function irPara(nome, instantaneo = false) {
  vistaAtual = nome;
  usuarioMexeu = false;
  pessoa.visible = nome !== 'frente' && nome !== 'janela'; // nessas vistas a pessoa taparia a bancada
  aereos.visible = nome !== 'cima';
  const v = VISTAS[nome]();
  v.pos.multiply(ESPELHO);
  v.alvo.multiply(ESPELHO);
  document.querySelectorAll('[data-vista]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.vista === nome)));
  if (instantaneo || reduzirMovimento.matches) {
    camera.position.copy(v.pos); controles.target.copy(v.alvo);
    camera.fov = v.fov; camera.updateProjectionMatrix();
    transicao = null;
    return;
  }
  transicao = { t: 0, de: { pos: camera.position.clone(), alvo: controles.target.clone(), fov: camera.fov }, para: v };
}
controles.addEventListener('start', () => { usuarioMexeu = true; transicao = null; });

// ---------- Cenário e portas ----------
let cenario = 'reforma', progressoPortas = 0, alvoPortas = 0, mostrarNomes = true;
const botaoPortas = document.getElementById('portas');
function definirCenario(nome) {
  cenario = nome;
  gReforma.visible = nome === 'reforma';
  gHoje.visible = nome === 'hoje';
  document.getElementById('cenario-hoje').setAttribute('aria-pressed', String(nome === 'hoje'));
  document.getElementById('cenario-reforma').setAttribute('aria-pressed', String(nome === 'reforma'));
  botaoPortas.disabled = nome !== 'reforma';
  if (nome !== 'reforma') definirPortas(false);
  atualizarPainel();
}
function definirPortas(abrir) {
  alvoPortas = abrir ? 1 : 0;
  botaoPortas.setAttribute('aria-pressed', String(abrir));
  botaoPortas.textContent = abrir ? 'Fechar as portas dos aparelhos' : 'Abrir as portas dos aparelhos';
}
function aplicarPortas(p) {
  pivoLS.rotation.y = THREE.MathUtils.degToRad(F.lsAngulo) * p;
  pivoLL.rotation.x = THREE.MathUtils.degToRad(F.llAngulo) * p;
}

// ---------- Painel ----------
const textosChip = { ok: 'folgado', justo: 'justo', limite: 'no limite' };
function itemResultado(nome, valor, classe, chip, detalhe) {
  const li = document.createElement('li');
  const n = document.createElement('span'); n.className = 'nome'; n.textContent = nome;
  const v = document.createElement('span'); v.className = 'valor'; v.textContent = valor;
  if (chip) { const c = document.createElement('span'); c.className = 'chip ' + classe; c.textContent = chip; v.append(c); }
  const d = document.createElement('span'); d.className = 'detalhe'; d.textContent = detalhe;
  li.append(n, v, d);
  return li;
}
function atualizarPainel() {
  const ul = document.getElementById('resultados');
  ul.replaceChildren();
  if (cenario === 'hoje') {
    ul.append(itemResultado('Corredor hoje', `≈ ${fmt(F.corredorHoje)} cm`, 'ok', 'passa 1 pessoa',
      'Da frente da máquina atual até a parede da porta.'));
    return;
  }
  ul.append(itemResultado('Corredor com tudo fechado', `≈ ${fmt(F.corredor)} cm`, 'ok', 'passa 1 pessoa',
    `Da frente da bancada (${fmt(B.profundidade)} cm de fundo) até a parede da porta.`));
  const sLS = situacao(F.lsSobra);
  ul.append(itemResultado('Lava e seca aberta', F.lsSobra >= 0 ? `sobram ≈ ${fmt(F.lsSobra)} cm` : 'encosta', sLS, textosChip[sLS],
    `Com a porta aberta, ocupa ≈ ${fmt(F.lsPonta)} cm a partir da parede de trás.`));
  const sLL = situacao(F.llSobra);
  ul.append(itemResultado('Lava-louças aberta', F.llSobra >= 0 ? `sobram ≈ ${fmt(F.llSobra)} cm` : 'encosta', sLL, textosChip[sLL],
    F.llSobra >= 0
      ? `Com a porta deitada, ocupa ≈ ${fmt(F.llPonta)} cm a partir da parede de trás.`
      : `A porta deitada precisaria de ≈ ${fmt(F.llPonta)} cm e o corredor tem ${fmt(W)}. Ela para em ≈ ${fmt(F.llAngulo)}°, quase deitada.`));
}
document.getElementById('nota-medidas').textContent =
  'Medidas aproximadas, para ter noção do espaço. Aparelhos com medidas de catálogo: lava e seca Samsung WD11M (60 × 85 × 65 cm) ' +
  'e lava-louças de 10 serviços (45 × 85 × 60 cm). A lava-louças aberta usa a média dos fabricantes (115 a 120 cm): confira no manual do modelo escolhido.';

document.getElementById('cenario-hoje').addEventListener('click', () => definirCenario('hoje'));
document.getElementById('cenario-reforma').addEventListener('click', () => definirCenario('reforma'));
botaoPortas.addEventListener('click', () => definirPortas(alvoPortas === 0));
document.querySelectorAll('[data-vista]').forEach(b => b.addEventListener('click', () => irPara(b.dataset.vista)));
const botaoNomes = document.getElementById('nomes');
botaoNomes.addEventListener('click', () => {
  mostrarNomes = !mostrarNomes;
  botaoNomes.setAttribute('aria-pressed', String(mostrarNomes));
  botaoNomes.textContent = mostrarNomes ? 'Esconder nomes' : 'Mostrar nomes';
});
document.getElementById('esconder').addEventListener('click', () => { painel.hidden = true; mostrar.hidden = false; mostrar.focus(); });
mostrar.addEventListener('click', () => { painel.hidden = false; mostrar.hidden = true; });

// ---------- Tema ----------
function aplicarTema() {
  const cor = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  cena.background = new THREE.Color(cor || '#e8ecec');
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicarTema);
new MutationObserver(aplicarTema).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
aplicarTema();

// ---------- Tamanho da tela ----------
function redimensionar() {
  largura = container.clientWidth || window.innerWidth;
  altura = container.clientHeight || window.innerHeight;
  renderer.setSize(largura, altura);
  rotuloRenderer.setSize(largura, altura);
  camera.aspect = largura / altura;
  atualizarAreaLivre();
  camera.updateProjectionMatrix();
  if (!usuarioMexeu) irPara(vistaAtual, true);
}
window.addEventListener('resize', redimensionar);
new ResizeObserver(redimensionar).observe(painel);
mostrar.addEventListener('click', () => requestAnimationFrame(redimensionar));

// ---------- Laço de desenho ----------
const relogio = new THREE.Clock();
const tmp = new THREE.Vector3();
const suave = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function visivel(o) { for (let p = o; p; p = p.parent) if (!p.visible) return false; return true; }
function quadro() {
  const dt = Math.min(relogio.getDelta(), 0.05);
  if (transicao) {
    transicao.t = Math.min(1, transicao.t + dt / 0.7);
    const k = suave(transicao.t), { de, para } = transicao;
    camera.position.lerpVectors(de.pos, para.pos, k);
    controles.target.lerpVectors(de.alvo, para.alvo, k);
    camera.fov = de.fov + (para.fov - de.fov) * k;
    camera.updateProjectionMatrix();
    if (transicao.t >= 1) transicao = null;
  }
  if (progressoPortas !== alvoPortas) {
    const passo = reduzirMovimento.matches ? 1 : dt / 0.9;
    progressoPortas = alvoPortas > progressoPortas ? Math.min(alvoPortas, progressoPortas + passo) : Math.max(alvoPortas, progressoPortas - passo);
    aplicarPortas(suave(progressoPortas));
  }
  controles.update();
  for (const p of paredes) p.grupo.visible = tmp.subVectors(camera.position, p.ponto).dot(p.normal) > -0.01;
  for (const r of rotulos) r.visible = mostrarNomes && visivel(r.parent) && (!r.userData.quando || r.userData.quando());
  renderer.render(cena, camera);
  rotuloRenderer.render(cena, camera);
  requestAnimationFrame(quadro);
}

definirCenario('reforma');
definirPortas(false);
redimensionar();
window.__cenaPronta = true;
requestAnimationFrame(quadro);
</script>
